<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Chord Inserter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      background: #F8F7F4;
      color: #1C1B19;
      padding: 16px;
      user-select: none;
    }
    h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #1C1B19; }
    label { display: block; font-size: 11px; color: #6B6760; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    input, select {
      width: 100%; height: 32px; border-radius: 6px;
      border: 0.5px solid #D4D1CA; padding: 0 10px;
      font-family: inherit; font-size: 13px; background: white;
      margin-bottom: 12px; outline: none;
    }
    input:focus, select:focus { border-color: #3D9E78; }
    .chord-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 16px;
    }
    .chord-btn {
      height: 32px; border-radius: 6px; border: 0.5px solid #D4D1CA;
      background: white; cursor: pointer; font-size: 12px; font-weight: 500;
      color: #1C1B19; transition: all 100ms;
    }
    .chord-btn:hover { border-color: #3D9E78; background: #EBF7F2; color: #3D9E78; }
    .chord-btn.active { background: #3D9E78; border-color: #3D9E78; color: white; }
    .row { display: flex; gap: 8px; margin-bottom: 12px; }
    .row input { flex: 1; margin-bottom: 0; }
    .insert-btn {
      width: 100%; height: 36px; border-radius: 6px; background: #3D9E78;
      border: none; color: white; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 100ms;
    }
    .insert-btn:hover { background: #2E8A66; }
    .insert-btn:disabled { background: #C8C4BC; cursor: not-allowed; }
    .status { font-size: 11px; color: #A09B94; text-align: center; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <h2>Insert Chord</h2>

  <label>Root note</label>
  <div class="row">
    <select id="root">
      <option>C</option><option>C#</option><option>D</option><option>D#</option>
      <option>E</option><option>F</option><option>F#</option><option>G</option>
      <option>G#</option><option>A</option><option>A#</option><option>B</option>
    </select>
    <select id="octave">
      <option>3</option><option value="4" selected>4</option><option>5</option>
    </select>
  </div>

  <label>Chord type</label>
  <div class="chord-grid">
    <button class="chord-btn active" data-type="">Major</button>
    <button class="chord-btn" data-type="m">Minor</button>
    <button class="chord-btn" data-type="7">7th</button>
    <button class="chord-btn" data-type="maj7">Maj7</button>
    <button class="chord-btn" data-type="m7">Min7</button>
    <button class="chord-btn" data-type="sus2">Sus2</button>
    <button class="chord-btn" data-type="sus4">Sus4</button>
    <button class="chord-btn" data-type="dim">Dim</button>
    <button class="chord-btn" data-type="aug">Aug</button>
    <button class="chord-btn" data-type="add9">Add9</button>
    <button class="chord-btn" data-type="6">6th</button>
    <button class="chord-btn" data-type="9">9th</button>
  </div>

  <button class="insert-btn" id="insert" onclick="insertChord()">Insert at playhead</button>
  <div class="status" id="status"></div>

  <script>
    const NOTE_MAP = {C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
    const INTERVALS = {
      '':   [0,4,7],        'm':   [0,3,7],
      '7':  [0,4,7,10],     'maj7':[0,4,7,11],
      'm7': [0,3,7,10],     'sus2':[0,2,7],
      'sus4':[0,5,7],       'dim': [0,3,6],
      'aug': [0,4,8],       'add9':[0,4,7,14],
      '6':  [0,4,7,9],      '9':  [0,4,7,10,14],
    };

    let selectedType = '';

    document.querySelectorAll('.chord-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.chord-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedType = btn.dataset.type;
      });
    });

    async function insertChord() {
      const rootName = document.getElementById('root').value;
      const octave   = parseInt(document.getElementById('octave').value);
      const type     = selectedType;

      const rootMidi = NOTE_MAP[rootName] + (octave + 1) * 12;
      const intervals = INTERVALS[type] || [0,4,7];
      const pitches   = intervals.map(i => rootMidi + i);

      const status = document.getElementById('status');
      const btn    = document.getElementById('insert');
      btn.disabled = true;

      try {
        // Get playhead position
        const pos = await melon.project.getPlayheadPosition();

        // Insert all notes at playhead
        await melon.notes.addMany(pitches.map(p => ({
          pitch: p, start: pos, duration: 1,
          lyric: rootName + (type || ''),
        })));

        const chordName = rootName + (type || '');
        status.textContent = `✓ Inserted ${chordName} (${pitches.length} notes)`;
        melon.notify({ type: 'success', title: `Inserted ${chordName}` });

        setTimeout(() => { status.textContent = ''; }, 2500);
      } catch (e) {
        status.textContent = `Error: ${e.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    // Listen for keyboard shortcut
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') insertChord();
      if (e.key === 'Escape') melon.window.close();
    });
  </script>
</body>
</html>
